server {
    listen 80;

    # Serve the React SPA; any path that doesn't match a static file is
    # routed to index.html so that client-side routing works correctly.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Optional: improve caching behaviour for hashed static assets
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
