# ---------------------------------------------------------------------------
# docker-compose.yml — RAG PDF Chatbot (local development)
#
# Services:
#   backend  — FastAPI RAG API (CPU-only) with EMBEDDED Qdrant (no separate
#              Qdrant container needed locally). Runs optional corpus ingestion
#              on start.
#
# The frontend runs natively via the Vite dev server (not in Docker):
#   cd frontend && npm install && npm run dev
#
# Usage:
#   docker compose up --build
#
# Required env vars (set in the root .env file):
#   GOOGLE_API_KEY      — API key for the hosted LLM provider (Gemini)
#
# Optional env vars:
#   CORPUS_HOST_DIR     — Host path to PDF corpus (default ./corpus)
#   SKIP_INGESTION      — "true" to skip corpus ingestion on startup
#
# Vector store: for local dev the backend uses qdrant-client's EMBEDDED mode
# (QDRANT_PATH) — Qdrant runs in-process and persists to the backend_data
# volume, so no Qdrant image/container is required. For production, set
# QDRANT_URL (+ QDRANT_API_KEY) to point at Qdrant Cloud or a Qdrant server.
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # Backend — RAG FastAPI application (CPU-only) with embedded Qdrant
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      # Embedded Qdrant: persist to the writable /data volume (no server).
      # Explicitly clear QDRANT_URL to use embedded on-disk mode.
      QDRANT_URL: ""
      QDRANT_PATH: /data/qdrant
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-corpus}

      # LLM provider configuration (key comes from the environment / .env)
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

      # Corpus ingestion paths
      CORPUS_DIR: /data/corpus
      INGESTION_ERROR_LOG: /data/ingestion_errors.jsonl
      SKIP_INGESTION: ${SKIP_INGESTION:-false}

      # Hugging Face model cache
      HF_HOME: /data/hf_cache
      HF_HUB_DOWNLOAD_TIMEOUT: "120"

      # Optional tuning knobs (sensible defaults apply when unset)
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-800}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-150}
      CHUNK_MIN_FINAL_TOKENS: ${CHUNK_MIN_FINAL_TOKENS:-100}
      DEFAULT_TOP_K: ${DEFAULT_TOP_K:-5}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      GENERATION_TIMEOUT_S: ${GENERATION_TIMEOUT_S:-30}
    volumes:
      # Mount a host directory as the corpus source so PDF files can be added
      # without rebuilding the image. Create it first: mkdir -p ./corpus
      - ${CORPUS_HOST_DIR:-./corpus}:/data/corpus:ro
      # Writable data directory: embedded Qdrant storage, error log, model cache
      - backend_data:/data

volumes:
  # Named volume for backend runtime data (embedded Qdrant, error log, cache)
  backend_data:
